name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    defaults:
      run:
        working-directory: RecipeApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show Swift Version
        run: swift --version

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            RecipeApp/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('RecipeApp/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve Dependencies
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Run Tests
        run: swift test -v --parallel

  build-ios:
    name: Build for iOS
    runs-on: macos-15

    defaults:
      run:
        working-directory: RecipeApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            RecipeApp/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-ios-${{ hashFiles('RecipeApp/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-ios-

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -scheme RecipeExtraction \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.0' \
            -skipPackagePluginValidation \
            | xcbeautify || true

  lint:
    name: Lint
    runs-on: macos-15

    defaults:
      run:
        working-directory: RecipeApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint || true

      - name: Run SwiftLint
        run: |
          if command -v swiftlint &> /dev/null; then
            swiftlint lint --reporter github-actions-logging || true
          else
            echo "SwiftLint not available, skipping"
          fi
